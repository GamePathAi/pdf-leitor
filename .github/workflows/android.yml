# Gera o app Android (.apk) e publica na página de Releases do GitHub.
# Link fixo para baixar a versão mais nova:
#   https://github.com/GamePathAi/pdf-leitor/releases/latest/download/PDF-Leitor.apk
name: App Android

on:
  push:
    branches: [main]
    paths: ['app/**', 'android/**', 'capacitor.config.json', 'package*.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npx cap sync android

      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf "%s" "$KEYSTORE_BASE64" | tr -d " 
" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_FLAGS=--latest" >> "$GITHUB_ENV"
          else
            echo "RELEASE_FLAGS=--prerelease" >> "$GITHUB_ENV"
            echo "TITLE_SUFFIX= (teste)" >> "$GITHUB_ENV"
            echo "::warning::Sem chave de assinatura: o APK será assinado com chave de teste (atualizações não instalam por cima)."
          fi

      - name: Compilar APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/PDF-Leitor.apk"

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v1.${VERSION_CODE}"
          gh release create "$TAG" "$RUNNER_TEMP/PDF-Leitor.apk" \
            --title "PDF Leitor para Android 1.${VERSION_CODE}${TITLE_SUFFIX}" \
            --notes "Baixe o **PDF-Leitor.apk** abaixo no celular e toque nele para instalar." \
            $RELEASE_FLAGS
